title = "Keelswell gitleaks config"

# Without this block a config file replaces gitleaks' rules instead of adding
# to them, and a config that only lists allowlists scans with no rules at all.
# install.sh copies this file into a fresh target, so keep it free of
# anything that is true of one repository only.
[extend]
useDefault = true

# The pre-commit hook pipes the staged diff to `gitleaks stdin`, which has no
# file paths, so every exception here is a pattern, not a path.

[[allowlists]]
  description = "BMAD installer manifest rows (_bmad/_config/files-manifest.csv): a file path and its sha256 checksum, not a credential"
  regexTarget = "line"
  regexes = [ '''","[0-9a-f]{64}"''' ]

[[allowlists]]
  description = "Upstream TEA doc fixture (api-testing-patterns.md): the public JWT header for HS256, cut off with an ellipsis"
  regexTarget = "line"
  regexes = [ '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.\.\.''' ]
