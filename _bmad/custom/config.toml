# Team / enterprise overrides for _bmad/config.toml.
# Committed to the repo — applies to every developer on the project.
# Tables deep-merge over base config; keyed entries merge by key.
# Example: override an agent descriptor, or add a new agent.
#
# [agents.bmad-agent-pm]
# description = "Prefers short, bulleted PRDs over narrative drafts."

# ─────────────────────────────────────────────────────────────────
# Keelswell overlay top-level keys (must precede any [table] -- errata B8).
# ─────────────────────────────────────────────────────────────────
devLoadAlwaysFiles = ["docs/architecture.md", "docs/project-context.md"]
expansionPacks = [
  "cloud-architecture",
  "data-architecture",
  "integration-patterns",
  "platform-engineering",
  "architecture-governance",
]

# ─────────────────────────────────────────────────────────────────
# Architecture Agent Expansion Pack (ported into .claude/skills/bmad-agent-arch-*).
# Registered here so bmad-help enumerates them in the agent roster. Names are
# the display names in config/agent-names.yaml.
# ─────────────────────────────────────────────────────────────────

[agents.bmad-agent-arch-infrastructure-analyst]
module = "arch"
team = "software-development"
name = "Ingrid"
title = "Infrastructure Analyst"
icon = "📊"
description = "Turns business needs into technical requirements a cloud architect can build against: functional and non-functional requirements traced to objectives, feasibility and risk surfaced early, stakeholder alignment before design begins."

[agents.bmad-agent-arch-cloud-architect]
module = "arch"
team = "software-development"
name = "Skye"
title = "Cloud Solutions Architect"
icon = "☁️"
description = "Designs cloud-native architectures across AWS, Azure, and GCP: pattern and service selection, deployment strategy, and quality attributes from scalability to sustainability. Pragmatic and platform-aware; every recommendation carries its rationale and trade-off."

[agents.bmad-agent-arch-cost-optimizer]
module = "arch"
team = "software-development"
name = "Costa"
title = "Cloud Cost Optimizer"
icon = "💰"
description = "Models TCO, finds and ranks cloud savings, plans budgets, and compares pricing across AWS, Azure, and GCP. Data-driven and ROI-focused; runs cost as a FinOps practice, every number with its assumption and every recommendation its saving."

[agents.bmad-agent-arch-security-reviewer]
module = "arch"
team = "software-development"
name = "Seku"
title = "Security & Compliance Reviewer"
icon = "🔒"
description = "Reviews architectures for security, models threats with STRIDE, and validates compliance across GDPR, HIPAA, PCI-DSS, and more. Defense-in-depth, zero-trust, least-privilege; every finding carries its risk and its remediation."

[agents.bmad-agent-arch-data-architect]
module = "arch"
team = "software-development"
name = "Jason"
title = "Data Architect"
icon = "🗄️"
description = "Designs schemas, pipelines, warehouses, and graph, knowledge-graph, and vector models, plans safe migrations, and sets data governance. Analytical and performance-conscious; every design carries its rationale, access patterns, and rollback."

[agents.bmad-agent-arch-integration-architect]
module = "arch"
team = "software-development"
name = "Inez"
title = "Integration Architect"
icon = "🔗"
description = "Designs REST, GraphQL, and gRPC APIs, messaging and event-driven systems, and system integrations with versioning and resilience. Standards-focused on OpenAPI, AsyncAPI, and CloudEvents; contracts before implementation, every design handles failure."

[agents.bmad-agent-arch-platform-engineer]
module = "arch"
team = "software-development"
name = "Platt"
title = "Platform Engineer"
icon = "⚙️"
description = "Designs CI/CD pipelines, Kubernetes, infrastructure-as-code, GitOps, and observability. Automation-focused and reliability-oriented; versions everything, shifts security left, secures the software supply chain, and plans for failure and fast recovery."

[agents.bmad-agent-arch-architecture-governor]
module = "arch"
team = "software-development"
name = "Gov"
title = "Architecture Governor"
icon = "📋"
description = "Writes ADRs, runs architecture and design reviews, maintains a tech radar and standards, and manages technical debt. Structured and quality-focused; facilitates decisions, every one with its rationale and every review a clear go or no-go."

# ─────────────────────────────────────────────────────────────────
# Vanilla BMAD core (preserved from upstream)
# ─────────────────────────────────────────────────────────────────
[architecture]
architectureFile = "docs/architecture.md"
infrastructureFile = "docs/architecture.md"

# -- Cloud Infrastructure pack contributions --
[requirements]            # Ingrid
requirementsFile = "docs/requirements.md"

[costAnalysis]            # Costa
costAnalysisFile = "docs/cost-analysis.md"

[security]                # Seku
securityAssessmentFile = "docs/security-assessment.md"

# -- Data Architecture pack contributions --
[dataArchitecture]        # Jason
erdFile = "docs/data-architecture.md"
dataDictionaryFile = "docs/data-dictionary.md"
pipelineSpecFile = "docs/data-pipeline.md"

# -- API Integration pack contributions --
[integration]             # Inez
apiSpecFile = "docs/integration.md"
eventSchemaFile = "docs/event-schemas.md"

# -- Platform Engineering pack contributions --
[platform]                # Platt
pipelineFile = "docs/platform.md"
kubernetesFile = "docs/kubernetes.md"
iacFile = "docs/infrastructure-as-code.md"

# -- Governance pack contributions --
[governance]              # Gov
governanceFile = "docs/governance.md"
adrDirectory = "docs/architecture/decisions/"
techRadarFile = "docs/architecture/tech-radar.md"
standardsDirectory = "docs/architecture/standards/"
reviewsDirectory = "docs/architecture/reviews/"

