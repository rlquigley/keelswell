# Reviewer trigger table for bmad-dev-wave step 10.
#
# Phase 6.3 of docs/harness-conversion-plan.md. Read by select_reviewers.py,
# which is the only thing that decides which reviewers a wave dispatches.
# Before 6.3, step 10 hardcoded "security, cost, and platform" and no wave
# skill referenced any of the sixteen fork-only agents at all.
#
# THE RULE IS NECESSITY, NOT A BUDGET. If eight domains are genuinely in the
# diff, eight rows fire and eight reviewers are dispatched. If one is, one is.
# There is no cap and no "top N most relevant" anywhere in this file or in the
# script that reads it, because a cap means choosing which real gaps to skip
# looking for. What keeps this affordable is trigger precision: every pattern
# below is answerable yes or no from the changed-file list and the spec, with
# no judgment. A trigger that needs interpretation is a wrong trigger.
#
# THE FIXED THREE LOSE THEIR EXEMPTION HERE. security (custom-appsec), cost
# (arch-cost-optimizer) and platform (arch-platform-engineer) are ordinary
# rows. A wave touching no infrastructure returns no platform reviewer.
# Security is seated as custom-appsec rather than arch-security-reviewer
# because custom-appsec is the seat docs/agent-inventory.md wrote a trigger
# for; seating both would double-dispatch one domain.
#
# FIELDS
#   role     the role code from config/agent-names.yaml. The key.
#   skill    the skill to dispatch.
#   display  the persona name, for the review record.
#   trigger  the condition, in words.
#   source   where `trigger` came from. Three values matter:
#              docs/agent-inventory.md:<line>  quoted verbatim from the
#                                              inventory's own Trigger line
#              derived-2026-09-14              written for this table, not by
#                                              the inventory; re-derive it
#                                              when the inventory next runs
#              none                            no trigger; the row is inert
#   paths    fnmatch globs, tested against each changed path and, for a
#            "**/"-prefixed pattern, against a top-level file too.
#   spec     literal phrases matched against the spec text with a LEADING
#            word boundary only, so "train" matches "training" but not
#            "constraint". That case is real: wave 4A's test design contains
#            "train" three times and all three are inside "constraint".
#   inert    present only on a row that can never fire. Names why. A row with
#            an `inert` key carries no `paths` and no `spec`.
#
# A row fires if ANY of its paths or spec patterns matches. Overlap between
# rows is expected and correct: custom-growth and custom-billing both fire on
# pricing, custom-accessibility and custom-design-critic both fire on a
# rendered surface. Two reviewers on one wave is necessity, not a collision.

version: 1

reviewers:

  # --- Group 1 of docs/agent-inventory.md: the six with an inventory trigger.

  - role: custom-ml
    skill: agent-ml
    display: "Damer Flinn"
    source: "docs/agent-inventory.md:89"
    trigger: "the wave trains, scores, selects, or validates a model, or touches a train/test split, a backtest window, or a feature table"
    paths:
      - "**/backtest*"
      - "**/*_backtest*"
      - "**/train*"
      - "**/*_train.py"
      - "**/*split*"
      - "**/*calibrat*"
      - "**/features/**"
      - "**/feature_*"
      - "**/*_model.py"
      - "**/models/*.py"
      - "**/evaluation/**"
    spec:
      - "train/test split"
      - "backtest"
      - "holdout"
      - "cross-validation"
      - "feature table"
      - "model selection"
      - "temporal leakage"
      - "proper scoring rule"

