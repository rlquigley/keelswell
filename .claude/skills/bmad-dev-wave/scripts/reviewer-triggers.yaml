# Reviewer trigger table for bmad-dev-wave step 10.
#
# Phase 6.3 of docs/harness-conversion-plan.md. Read by select_reviewers.py,
# which is the only thing that decides which reviewers a wave dispatches.
# Before 6.3, step 10 hardcoded "security, cost, and platform" and no wave
# skill referenced any of the sixteen fork-only agents at all.
#
# THE RULE IS NECESSITY, NOT A BUDGET. If eight domains are genuinely in the
# diff, eight rows fire and eight reviewers are dispatched. If one is, one is.
# There is no cap and no "top N most relevant" anywhere in this file or in the
# script that reads it, because a cap means choosing which real gaps to skip
# looking for. What keeps this affordable is trigger precision: every pattern
# below is answerable yes or no from the changed-file list and the spec, with
# no judgment. A trigger that needs interpretation is a wrong trigger.
#
# THE FIXED THREE LOSE THEIR EXEMPTION HERE. security (custom-appsec), cost
# (arch-cost-optimizer) and platform (arch-platform-engineer) are ordinary
# rows. A wave touching no infrastructure returns no platform reviewer.
# Security is seated as custom-appsec rather than arch-security-reviewer
# because custom-appsec is the seat docs/agent-inventory.md wrote a trigger
# for; seating both would double-dispatch one domain.
#
# FIELDS
#   role     the role code from config/agent-names.yaml. The key.
#   skill    the skill to dispatch.
#   display  the persona name, for the review record.
#   trigger  the condition, in words.
#   source   where `trigger` came from. Three values matter:
#              docs/agent-inventory.md:<line>  quoted verbatim from the
#                                              inventory's own Trigger line
#              derived-2026-09-14              written for this table, not by
#                                              the inventory; re-derive it
#                                              when the inventory next runs
#              none                            no trigger; the row is inert
#   paths    fnmatch globs, tested against each changed path and, for a
#            "**/"-prefixed pattern, against a top-level file too.
#   spec     literal phrases matched against the spec text with a LEADING
#            word boundary only, so "train" matches "training" but not
#            "constraint". That case is real: wave 4A's test design contains
#            "train" three times and all three are inside "constraint".
#   generalist  optional, "yes" on a row that answers for no particular
#            domain. A selection holding only generalists is treated as an
#            empty one for the purposes of the fallback: the wave still gets
#            its generalist AND the fallback method, because "somebody read
#            it" is not the same answer as "somebody attacked it".
#   not_paths  optional. Paths matching any of these are removed from the
#            candidate set BEFORE `paths` is tested, so a row can say "source,
#            but not its tests". Only bmm-dev needs it: every other row names
#            what it wants rather than what it does not.
#   inert    present only on a row that can never fire. Names why. A row with
#            an `inert` key carries no `paths` and no `spec`.
#
# STRUCTURAL VOCABULARY IS NEVER A TRIGGER. A BMAD test design quotes the
# story's acceptance criteria and cites the PRD's functional requirements by
# construction, so "acceptance criterion", "functional requirement",
# "success metric" and their kin appear in every spec and separate nothing.
# Seating them fired bmm-qa and bmm-pm on nine of ffbapp's eighteen waves
# apiece, on the form of the document rather than the subject of the wave.
# The same trap catches a word the project has redefined: "pricing" means what
# a fantasy rule set charges for a touchdown, "presentation" means ffbapp's
# exposure dial, and neither is about money or slides. Match the domain's
# vocabulary, never the harness's, and never a word the repo has taken.
#
# A row fires if ANY of its paths or spec patterns matches. Overlap between
# rows is expected and correct: custom-growth and custom-billing both fire on
# pricing, custom-accessibility and custom-design-critic both fire on a
# rendered surface. Two reviewers on one wave is necessity, not a collision.

version: 1

# WHEN NO ROW FIRES. Four of ffbapp's eighteen waves select nobody: 3A (a
# grammar AST), 3C (test fixtures and a regression test), 3D (a pricing
# compiler) and 4A (an event-class registry). Their diffs hold no reviewer's
# domain, and that is the correct answer to the question the table asks. It is
# not the correct answer to whether the wave was reviewed.
#
# The evidence says what to send instead, and it is a method rather than a
# seat. 3A and 3D both ran real reviews and neither named a persona: their
# reviewers were "mutation-based correctness review", "specimen expressiveness
# review" and "real-sheet execution review", and 3D's record says outright that
# it ran "under the wave 3A pattern". Across all ten ffbapp review records, not
# one reviewer heading names an agent. That review found the two HIGH findings
# on 3A -- non-finite Decimals passing every type check, and
# decimal.InvalidOperation escaping the degrade posture because it is an
# ArithmeticError rather than a ValueError. No seat in the table above would
# have looked for either; a fifteen-mutation sweep found both.
#
# 3C and 4A had no review at all, and both are marked load-bearing in ffbapp's
# own wave map. That is the failure this block exists to stop.
#
# This is not the step-7 evaluator a second time. That one reads: fresh
# context, Read/Glob/Grep, no Bash. This one executes -- the standing party
# brief is that a finding is proved by execution or by mutation, never by
# reading.

fallback:
  method: "the wave 3A pattern"
  reviewers: "2"
  source: "derived-2026-09-14 from ffbapp docs/wave-3a and docs/wave-3d review records"
  brief: "Two concurrent reviewers with disjoint domains, each stated before either starts. Reviewer 1 runs a mutation sweep over the diff's production files, mutating and byte-restoring per probe, and reports every mutation that stayed green as either a real gap or a proved redundancy. Reviewer 2 executes the wave's own subject against real data outside the repo's tests. Then a third pass, held back and given only the finding text, writes its own exploits without reading the remediation's tests. Every finding is proved by execution or by mutation and none by reading."
  record_as: "fallback"

