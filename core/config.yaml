# core/config.yaml
# Keelswell fork: the tier table. Which model and effort each routed role runs
# at, and the subagent definitions each role binds. install.sh is the only
# reader: the resolver fills a fresh instance's .claude/settings.json (model,
# effortLevel) from the orchestrator row, and phase 6 asserts that every
# definition under `agents` carries the row's model and effort. It reads and
# never repairs: change a row and the definitions in the same commit.
#
# Models are full ids, not aliases, so two review records are comparable.
# Re-pin per model release, with a CHANGELOG line (docs/agent-inventory.md).
fork:
  name: keelswell
  version: 0.1.0
  schema_version: 1
model_tiers:
  frontier:
    model: claude-opus-5-5
  workhorse:
    model: claude-sonnet-5-5
role_models:
  orchestrator: { tier: frontier,  effort: high }
  coding:       { tier: workhorse, effort: high, agents: [keelswell-wave-coder] }
  adversarial:  { tier: frontier,  effort: high, agents: [keelswell-wave-reviewer, keelswell-wave-evaluator] }
