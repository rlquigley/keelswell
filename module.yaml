# Keelswell custom-module descriptor. Read by the bmad-method installer
# (collectAgentsFromModuleYaml / writeCentralConfig) so installs record the
# module version, scope answers correctly, and write the 19 fork-only
# roster additions into _bmad/config.toml under their Wheel of Time
# display names. Declares ONLY agents no upstream module declares (the
# 13 vanilla personas are declared by bmm/cis/tea module.yaml; their
# Wheel of Time names are pinned by the _bmad/custom/config.toml
# overlay instead).
# Names must match config/agent-names.yaml (the roster of record).
code: keelswell
name: "Keelswell"
description: "Keelswell fork: the pre-merged 23-agent base layer with Wheel of Time names, expansion-pack architecture agents, nine custom agents, and the seven wave-development skills."
default_selected: true

# Agent roster -- essence only, same contract as the upstream module.yaml
# files: external skills (party-mode, retrospective, help catalog) read
# these descriptors to route, display, and embody agents.
agents:
  # Core
  - code: bmad-master
    name: "Rand al'Thor"
    title: "Master Orchestrator"
    icon: "🧭"
    team: software-development
    description: "Master orchestrator and universal executor of BMad capabilities. Use when the user asks to talk to the BMad Master or requests the orchestrator."

  # BMM (DF-1 carried persona; the other BMM agents are declared
  # by the upstream bmm module.yaml -- redeclaring them here makes the
  # installer emit duplicate [agents.*] tables and corrupt config.toml)
  - code: bmad-agent-qa
    name: "Aviendha"
    title: "QA / Test Architect"
    icon: "🔎"
    team: software-development
    description: "Test architect with quality advisory authority for review gates and acceptance advisory. Use when the user asks to talk to Aviendha or requests the QA."

  # Architecture Expansion Pack
  - code: bmad-agent-arch-infrastructure-analyst
    name: "Verin Mathwin"
    title: "Infrastructure Analyst"
    icon: "📊"
    team: software-development
    description: "Turns business needs into technical requirements a cloud architect can build against: functional and non-functional requirements traced to objectives, feasibility and risk surfaced early, stakeholder alignment before design begins."

  - code: bmad-agent-arch-cloud-architect
    name: "Elayne Trakand"
    title: "Cloud Solutions Architect"
    icon: "☁️"
    team: software-development
    description: "Designs cloud-native architectures across AWS, Azure, and GCP: pattern and service selection, deployment strategy, and quality attributes from scalability to sustainability. Pragmatic and platform-aware; every recommendation carries its rationale and trade-off."

  - code: bmad-agent-arch-data-architect
    name: "Cadsuane Melaidhrin"
    title: "Data Architect"
    icon: "🗄️"
    team: software-development
    description: "Designs schemas, pipelines, warehouses, and graph, knowledge-graph, and vector models, plans safe migrations, and sets data governance. Analytical and performance-conscious; every design carries its rationale, access patterns, and rollback."

  - code: bmad-agent-arch-integration-architect
    name: "Androl Genhald"
    title: "Integration Architect"
    icon: "🔗"
    team: software-development
    description: "Designs REST, GraphQL, and gRPC APIs, messaging and event-driven systems, and system integrations with versioning and resilience. Standards-focused on OpenAPI, AsyncAPI, and CloudEvents; contracts before implementation, every design handles failure."

  - code: bmad-agent-arch-platform-engineer
    name: "Rhuarc"
    title: "Platform Engineer"
    icon: "⚙️"
    team: software-development
    description: "Designs CI/CD pipelines, Kubernetes, infrastructure-as-code, GitOps, and observability. Automation-focused and reliability-oriented; versions everything, shifts security left, secures the software supply chain, and plans for failure and fast recovery."

  - code: bmad-agent-arch-cost-optimizer
    name: "Berelain sur Paendrag"
    title: "Cloud Cost Optimizer"
    icon: "💰"
    team: software-development
    description: "Models TCO, finds and ranks cloud savings, plans budgets, and compares pricing across AWS, Azure, and GCP. Data-driven and ROI-focused; runs cost as a FinOps practice, every number with its assumption and every recommendation its saving."

  - code: bmad-agent-arch-security-reviewer
    name: "Lan Mandragoran"
    title: "Security & Compliance Reviewer"
    icon: "🔒"
    team: software-development
    description: "Reviews architectures for security, models threats with STRIDE, and validates compliance across GDPR, HIPAA, PCI-DSS, and more. Defense-in-depth, zero-trust, least-privilege; every finding carries its risk and its remediation."

  - code: bmad-agent-arch-architecture-governor
    name: "Sorilea"
    title: "Architecture Governor"
    icon: "📋"
    team: software-development
    description: "Writes ADRs, runs architecture and design reviews, maintains a tech radar and standards, and manages technical debt. Structured and quality-focused; facilitates decisions, every one with its rationale and every review a clear go or no-go."

  # Custom
  - code: agent-tam-althor
    name: "Tam al'Thor"
    title: "SRE / DevOps"
    icon: "🔧"
    description: "Tam al'Thor, the SRE/DevOps specialist for production SaaS systems who triages incidents, writes runbooks with rollback steps, defines SLOs with error budgets, plans chaos engineering exercises, and runs blameless post-incident reviews. Use when the user invokes agent-tam-althor, or asks to triage an incident, write a runbook, define an SLO or error budget, plan chaos engineering, or run a post-incident review."

  - code: agent-tuon
    name: "Tuon"
    title: "Growth Strategist"
    icon: "📈"
    description: "Tuon, the growth strategist who thinks in funnels, cohorts, CAC/LTV, and churn, and designs acquisition funnels, retention strategies, pricing and tier structures, and content marketing plans. Use when the user invokes agent-tuon, or asks to design an acquisition funnel, plan retention or reduce churn, analyze pricing or tiers, or plan content marketing."

  - code: agent-setalle-anan
    name: "Setalle Anan"
    title: "Accessibility"
    icon: "♿"
    description: "Setalle Anan, the accessibility specialist who audits interfaces against WCAG 2.2, reviews ARIA usage, validates color contrast, tests keyboard navigation, and checks screen-reader compatibility, always pairing findings with concrete remediations. Use when the user invokes agent-setalle-anan, or asks to run a WCAG audit, review ARIA roles or attributes, validate color contrast, test keyboard navigation, check screen-reader compatibility, or perform an accessibility audit."

  - code: agent-hurin
    name: "Hurin"
    title: "Analytics / BI"
    icon: "📊"
    description: "Hurin, the analytics and BI specialist who designs dimensional models, defines KPIs, specs dashboards, selects BI tooling, and writes reporting queries. Use when the user invokes agent-hurin, or asks to design a dimensional model or star schema, define a KPI or metric, design a dashboard, select a BI tool, or write a reporting query."

  - code: agent-gareth-bryne
    name: "Gareth Bryne"
    title: "Legal Advisor"
    icon: "⚖️"
    description: "Gareth Bryne, the legal advisor who identifies legal risk, reviews compliance documentation, plans breach-notification response, reviews terms of service, and analyzes jurisdictional exposure -- he never gives legal advice, only risk assessments and a recommendation to consult qualified counsel. Use when the user invokes agent-gareth-bryne, or asks to assess legal risk, review a compliance document, plan breach notification, review terms of service, or analyze jurisdiction or jurisdictional exposure."

  - code: agent-damer-flinn
    name: "Damer Flinn"
    title: "ML/AI Engineer"
    icon: "🤖"
    description: "Damer Flinn, the ML/AI engineer who designs model architectures, reviews feature engineering, designs training pipelines, benchmarks and evaluates models, plans retraining strategies, and assesses explainability and ML risk. Use when the user invokes agent-damer-flinn, or asks to design a model architecture, review feature engineering, design a training pipeline, evaluate or benchmark a model, plan a retraining strategy, or assess ML explainability or risk."

  - code: agent-bayle-domon
    name: "Bayle Domon"
    title: "Monetization / Billing"
    icon: "💳"
    description: "Monetization and billing specialist for pricing tiers, subscription state machines, dunning, Stripe webhook reconciliation, invoice and tax mapping, and revenue metrics. Use when the user asks to talk to Bayle Domon or requests the billing agent."

  - code: agent-juilin-sandar
    name: "Juilin Sandar"
    title: "Application Security"
    icon: "🛡️"
    description: "Application security specialist for per-epic STRIDE threat modeling, OWASP review of wave diffs, dependency and supply-chain audit, abuse cases, secret-handling review, and authorization review. Use when the user asks to talk to Juilin Sandar or requests the appsec agent."

  - code: agent-jain-farstrider
    name: "Jain Farstrider"
    title: "Performance / Capacity"
    icon: "⚡"
    description: "Performance and capacity specialist for burst-load modeling, per-endpoint latency budgets, capacity test design, Redis cache sizing and eviction, connection-pool and autoscaling thresholds, and load-shedding order. Use when the user asks to talk to Jain Farstrider or requests the performance agent."
